<header class="nav-header">
  <!-- LEFT -->
  <div class="nav-left">
    <span class="logo">Daloy</span>
  </div>

  <!-- RIGHT -->
  <nav class="nav-right">
    <a
      routerLink="/whats-new"
      routerLinkActive="active"
      class="nav-link"
    >
      What’s New
    </a>

    <a
      routerLink="/home"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-link"
    >
      Home
    </a>

<!-- PROFILE -->
<div class="profile">

  <div class="profile-trigger" (click)="toggleDropdown()">
    <div class="avatar"></div>
    <span class="profile-name">Profile</span>
  </div>

  <div class="dropdown" *ngIf="isDropdownOpen">
    <button (click)="goProfile()">Profile</button>
    <button (click)="goProfileSettings()">Profile Settings</button>
    <button class="logout" (click)="logout()">Logout</button>
  </div>

</div>

  </nav>
</header>
