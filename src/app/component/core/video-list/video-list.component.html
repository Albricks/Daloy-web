<div class="videos-page">

  <!-- Header -->
  <header class="page-header">
    <h1>Videos</h1>
    <p>Enhance Your Learning Journey with Videos</p>
  </header>

  <!-- Controls (STATUS ONLY) -->
  <section class="controls">
    <select [(ngModel)]="selectedStatus">
      <option value="All">All Status</option>
      <option value="not-started">New</option>
      <option value="in-progress">In Progress</option>
      <option value="completed">Completed</option>
    </select>
  </section>

  <!-- Loading State -->
  <div *ngIf="loading" class="loading">
    Loading videos...
  </div>

  <!-- Error State -->
  <div *ngIf="error" class="error">
    {{ error }}
  </div>

  <!-- Videos Grid -->
  <section class="videos-grid" *ngIf="!loading && !error">
    <article
      class="video-card"
      *ngFor="let video of filteredVideos"
      (click)="openVideo(video.id)"
    >

      <div class="thumb">
        <img [src]="video.thumbnailUrl" alt="video thumbnail" />

        <div class="overlay">
          <span class="play-icon">▶</span>
        </div>

        <span class="duration">{{ video.duration }}</span>

        <span
          class="status-badge"
          [ngClass]="video.status"
        >
          {{ getStatusLabel(video.status) }}
        </span>
      </div>

      <h3 class="title">{{ video.title }}</h3>

    </article>
  </section>

  <!-- Empty State -->
  <div
    *ngIf="!loading && !error && filteredVideos.length === 0"
    class="empty-state"
  >
    No videos found for this status.
  </div>

</div>
