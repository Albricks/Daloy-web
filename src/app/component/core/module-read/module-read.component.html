<div class="reader">

  <!-- TOP BAR -->
  <header class="reader-header">
    <button class="back" (click)="goBackToPreview()">
      ← Back
    </button>

    <span class="title">{{ currentLesson?.title }}</span>

    <button class="exit" (click)="exitToModules()">
      Exit
    </button>
  </header>

  <div class="reader-layout">

    <!-- SIDEBAR -->
    <aside class="lesson-sidebar">
      <h4>Lessons</h4>

      <ul>
        <li
          *ngFor="let lesson of lessons"
          [class.active]="lesson.id === currentLesson?.id"
          (click)="selectLesson(lesson)"
        >
          <span>
            {{ lesson.order }}. {{ lesson.title }}
          </span>

          <small *ngIf="lesson.estimatedMinutes">
            {{ lesson.estimatedMinutes }} min
          </small>
        </li>
      </ul>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="lesson-main" #lessonMain>

      <!-- Loading State -->
      <div *ngIf="isLoading" class="loading">
        Loading lesson...
      </div>

      <!-- 🔥 BLOB HTML RENDERED HERE -->
      <div
        *ngIf="!isLoading"
        class="lesson-content fade-in"
        [innerHTML]="lessonHtml">
      </div>

      <!-- NEXT / PREVIOUS NAV -->
      <div class="lesson-nav" *ngIf="!isLoading">
        <button
          class="nav-btn prev"
          [disabled]="!hasPrevious"
          (click)="goToPrevious()"
        >
          ← Previous
        </button>

        <button
          class="nav-btn next"
          [disabled]="!hasNext"
          (click)="goToNext()"
        >
          Next →
        </button>
      </div>

      <!-- SITUATIONAL CTA (Only for LAST Lesson) -->
      <div
        *ngIf="isLastLesson"
        class="quiz-prompt"
      >
        <h3>Apply what you’ve learned ✍️</h3>
        <p>
          Before taking the quiz, complete a short situational activity to
          reflect on real-life decisions related to this lesson.
        </p>
        <button class="quiz-btn" (click)="goToSituational()">
          Continue to Activity
        </button>
      </div>


    </main>
  </div>
</div>
