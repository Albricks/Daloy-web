<div *ngIf="!finished" class="quiz-wrapper">
  <h2>Knowledge Check</h2>
  <p class="subtitle">Let’s see what stuck 👀</p>

  <div class="progress">
    {{ currentQuestionIndex + 1 }} /
    {{ quiz.questions.length }}
  </div>

  <div class="question-card">
    <h3>{{ quiz.questions[currentQuestionIndex].question }}</h3>

    <div class="options">
      <button
        *ngFor="let option of quiz.questions[currentQuestionIndex].options"
        (click)="selectOption(option.id)"
        [class.selected]="selectedOptionId === option.id"
      >
        {{ option.text }}
      </button>
    </div>
  </div>

  <button
    class="next-btn"
    [disabled]="!selectedOptionId"
    (click)="next()"
  >
    {{ currentQuestionIndex === quiz.questions.length - 1
        ? 'Finish'
        : 'Next' }}
  </button>
</div>

<div *ngIf="finished" class="result-wrapper">
  <h2>Nice work 🎉</h2>
  <div class="score">{{ scorePercent }}%</div>

  <p *ngIf="scorePercent >= quiz.passingScore" class="pass">
    You’re good to move on 🚀
  </p>

  <p *ngIf="scorePercent < quiz.passingScore" class="fail">
    No stress — try again when you’re ready 💪
  </p>
</div>
