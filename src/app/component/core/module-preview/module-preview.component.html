<div class="module-preview" *ngIf="!isLoading && module">

  <a class="back-link" (click)="goBack()">← Back to Modules</a>

  <div class="hero">

    <!-- LEFT -->
    <div class="hero-left">

      <span
        class="status"
        [ngClass]="statusClass"
      >
        {{ module.status }}
      </span>

      <h1>{{ module.title }}</h1>

      <p class="subtitle">
        {{ module.description }}
      </p>

      <section class="learn">
        <h3>What you’ll learn</h3>
        <ul>
          <li *ngFor="let obj of module.objectives">
            {{ obj }}
          </li>
        </ul>
      </section>

    </div>

    <!-- RIGHT CARD -->
    <aside class="hero-right">

      <div class="meta">
        <div>
          <span>Level</span>
          <strong>{{ module.level }}</strong>
        </div>

        <div>
          <span>Duration</span>
          <strong>{{ module.duration }}</strong>
        </div>

        <div>
          <span>Lessons</span>
          <strong>{{ module.lessons }}</strong>
        </div>
      </div>

      <button class="cta" (click)="startModule()">
        {{ module.status === 'In Progress' ? 'Continue Module' : 'Start Module' }}
      </button>

      <p class="hint">
        You can stop anytime and resume later.
      </p>

    </aside>

  </div>
</div>

<!-- Loading -->
<div class="module-preview" *ngIf="isLoading">
  <p>Loading module...</p>
</div>
