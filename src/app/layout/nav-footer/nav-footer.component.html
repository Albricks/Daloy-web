    <button (click)="openModal('contact')">Contact</button>

    <button (click)="openModal('privacy')">Privacy</button>

<!-- ABOUT -->
<app-modal
  title="About Daloy"
  [isOpen]="activeModal === 'about'"
  (close)="closeModal()"
>
  <p>Daloy provides accessible learning tools for modern education.</p>
</app-modal>

<!-- CONTACT -->
<app-modal
  title="Contact Us"
  [isOpen]="activeModal === 'contact'"
  (close)="closeModal()"
>
  <p>Email: support@daloy.com</p>
</app-modal>

<!-- PRIVACY -->
<app-modal
  title="Privacy Policy"
  [isOpen]="activeModal === 'privacy'"
  (close)="closeModal()"
>
  <p>
    We respect your privacy and protect your personal information.
  </p>
</app-modal>
