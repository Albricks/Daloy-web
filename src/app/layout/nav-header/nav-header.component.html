<header class="nav-header">
  <!-- LEFT -->
  <div class="nav-left">
    <span class="logo">Daloy</span>
  </div>

  <!-- RIGHT -->
  <nav class="nav-right">
    <a
      routerLink="/whats-new"
      routerLinkActive="active"
      class="nav-link"
    >
      What’s New
    </a>

    <a
      routerLink="/home"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-link"
    >
      Home
    </a>

<!-- PROFILE -->
<div class="profile" *ngIf="user$ | async as user">

  <div class="profile-trigger" (click)="toggleDropdown()">

    <!-- Avatar -->
    <ng-container *ngIf="user.avatarUrl; else fallbackAvatar">
      <img
        class="avatar"
        [src]="user.avatarUrl"
        alt="User avatar"
      />
    </ng-container>

    <!-- Fallback (initial) -->
    <ng-template #fallbackAvatar>
      <div class="avatar avatar-fallback">
        {{ user.userName[0] | uppercase }}
      </div>
    </ng-template>

    <span class="profile-name">
      {{ user.userName }}
    </span>

  </div>

  <div class="dropdown" *ngIf="isDropdownOpen">
    <button (click)="goProfile()">Profile</button>
    <button (click)="goProfileSettings()">Profile Settings</button>
    <button class="logout" (click)="logout()">Logout</button>
  </div>

</div>

  </nav>
</header>
