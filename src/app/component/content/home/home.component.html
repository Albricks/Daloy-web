<div class="home-page">

  <!-- HERO -->
<section class="hero">
  <ng-container *ngIf="user$ | async as user; else loading">
    <h1>
      Hi {{ user.userName }}, welcome to Daloy 👋
    </h1>
  </ng-container>

  <ng-template #loading>
    <h1>Welcome to Daloy</h1>
  </ng-template>

  <p><b>Your digital learning and personal growth space</b></p>
</section>

  <!-- FEATURE CARDS -->
<section class="features">

  <div class="feature-card" (click)="goTo('/modules')">
    <div class="image">
      <img
        src="assets/home/mods.png"
        alt="Digital Modules"
        class="feature-img modules"
      />
    </div>
    <h3>Digital Modules</h3>
    <p>Access curated learning modules anytime.</p>
  </div>

  <div class="feature-card highlight" (click)="goTo('/videos')">
    <div class="image">
      <img
        src="assets/home/vids.png"
        alt="Featured Videos"
        class="feature-img videos"
      />
    </div>
    <h3>Featured Videos</h3>
    <p>Watch hand-picked videos designed for you.</p>
  </div>

  <div class="feature-card" (click)="goTo('/diary')">
    <div class="image">
      <img
        src="assets/home/diary.png"
        alt="My Daloy Diary"
        class="feature-img diary"
      />
    </div>
    <h3>My Daloy Diary</h3>
    <p>Track progress, reflections, and insights.</p>
  </div>

</section>

</div>
